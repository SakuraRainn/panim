[package]
name = "panim-vault"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aes = "0.9.4"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
panim-core = { path = "../panim-core" }
pbkdf2 = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["backup", "serialize"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
tar = "0.4.46"
zeroize = "1.9.1"

# The SQLite of macOS is older than 3.44, and `rusqlite` needs 3.44 or later. Thus, macOS uses the bundled SQLite.
# WebKit on macOS keeps its databases in its own processes, so a second SQLite in PANIM is safe there.
# Linux keeps the SQLite of the system. Refer to `docs/DISCUSSION.md` §48 and §56.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["backup", "serialize", "bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
