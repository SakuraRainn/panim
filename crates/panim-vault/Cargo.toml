[package]
name = "panim-vault"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aes = "0.9.4"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
panim-core = { path = "../panim-core" }
pbkdf2 = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
tar = "0.4.46"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
