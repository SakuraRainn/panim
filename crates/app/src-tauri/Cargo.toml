[package]
name = "panim"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
panim-core = { path = "../../panim-core" }
panim-github = { path = "../../panim-github" }
panim-telegram = { path = "../../panim-telegram" }
panim-vault = { path = "../../panim-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The identifier of the data store of a browser profile, and the name of the folder of the RAM disk on macOS.
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
url = "2.5.8"

# The input of the browser windows for the automatic lock (`docs/ARCHITECTURE.md` §2). This is the version of Tauri
# and wry.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

# macOS (milestone 12, not tested on a Mac). Cargo adds these features to the dependency `tauri` above.
# - `macos-proxy`: without it, wry ignores `proxy_url` on macOS, and the profiles do not use the route of the persona.
#   It needs macOS 14 or later (`bundle/macos.json`).
# - objc2, objc2-app-kit and block2: the `NSEvent` monitor for the automatic lock. These are the versions of wry.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12.5", features = ["macos-proxy"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSEvent",
    "NSResponder",
    "NSWindow",
] }
block2 = "0.6.2"

[dev-dependencies]
# The fake HTTP client. A test of the connector uses no network.
panim-github = { path = "../../panim-github", features = ["fake"] }
# The fake TDLib. A test of the connector uses no network and no Telegram account.
panim-telegram = { path = "../../panim-telegram", features = ["fake"] }
tempfile = "3.27.0"
# The mock runtime. A test examines the capabilities without a window.
tauri = { version = "2.12.5", features = ["test"] }
