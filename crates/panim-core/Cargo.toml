[package]
name = "panim-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bip39 = "3.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sha3 = "0.12.0"
zeroize = "1.9.1"
